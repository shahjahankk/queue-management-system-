<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PetZone Hospital - Attendant</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="header">
    <img src="/assets/petzonelogo.png" alt="PetZone" class="logo" onerror="this.src='/assets/petzonelogo.svg'">
    <div>
      <h2 id="brandTitle" style="color: var(--blue);">PetZone Hospital</h2>
      <p id="branchTitle" style="font-size: 15px; color: var(--gray-500); margin-top: 2px;">Attendant Panel</p>
      <p id="stationLabel" style="font-size: 14px; color: var(--gray-500); margin-top: 4px;"></p>
    </div>
    <nav>
      <a href="/" class="btn btn-outline btn-sm">Home</a>
    </nav>
  </header>

  <div class="container">
    <div id="alert" class="alert hidden"></div>

    <div class="grid-4" style="margin-bottom: 24px;" id="statsRow">
      <div class="card stat-card"><div class="number" id="statWaiting">0</div><div class="label">Waiting</div></div>
      <div class="card stat-card"><div class="number" id="statProgress">0</div><div class="label">In Progress</div></div>
      <div class="card stat-card"><div class="number" id="statCompleted">0</div><div class="label">Completed</div></div>
      <div class="card stat-card"><div class="number" id="statTotal">0</div><div class="label">Total Today</div></div>
    </div>

    <div class="grid-2">
      <div class="card">
        <h3 style="color: var(--blue); margin-bottom: 16px;">Call Next Patient</h3>
        <div class="form-group">
          <label>Counter</label>
          <select id="counterSelect"></select>
        </div>
        <button class="btn btn-primary btn-lg" id="btnCallNext" style="width: 100%;">Call Next Number</button>

        <div id="currentTicket" class="card" style="margin-top: 20px; background: var(--gray-50); display: none;">
          <div style="text-align: center;">
            <div style="font-size: 14px; color: var(--gray-500);">Currently Called</div>
            <div id="currentNumber" style="font-size: 64px; font-weight: 900; color: var(--blue);"></div>
            <div id="currentService" style="font-size: 16px; margin-bottom: 12px;"></div>
            <div id="currentMeta" style="font-size: 14px; color: var(--gray-500); margin-bottom: 16px;"></div>
            <div style="display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;">
              <button class="btn btn-success btn-sm" data-action="serving">Start Serving</button>
              <button class="btn btn-primary btn-sm" data-action="completed">Complete</button>
              <button class="btn btn-outline btn-sm" data-action="recall">Recall</button>
              <button class="btn btn-danger btn-sm" data-action="skipped">Skip</button>
            </div>
          </div>
        </div>
      </div>

      <div class="card">
        <h3 style="color: var(--blue); margin-bottom: 16px;">Waiting Queue</h3>
        <div id="queueList" style="max-height: 500px; overflow-y: auto;">
          <p style="color: var(--gray-500);">Loading...</p>
        </div>
      </div>
    </div>

    <div class="card" style="margin-top: 24px;" id="clinicChatCard">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px;">
        <div>
          <h3 style="color: var(--blue); margin: 0;">Clinic Chat</h3>
          <p style="margin: 4px 0 0; font-size: 13px; color: var(--gray-500);">
            Shared notes for OPD, Grooming, Reception &amp; Cashier (e.g. add vaccination charge)
          </p>
        </div>
        <span id="chatStatus" style="font-size:12px;color:var(--gray-500);">Connecting…</span>
      </div>
      <div style="display:grid;grid-template-columns:180px 1fr;gap:10px;margin-bottom:10px;">
        <div class="form-group" style="margin:0;">
          <label>You are</label>
          <select id="chatSender">
            <option value="Reception">Reception</option>
            <option value="Cashier">Cashier</option>
            <option value="OPD 1">OPD 1</option>
            <option value="OPD 2">OPD 2</option>
            <option value="Grooming">Grooming</option>
            <option value="custom">Custom name…</option>
          </select>
        </div>
        <div class="form-group" style="margin:0;">
          <label>Custom name (optional)</label>
          <input id="chatCustomName" type="text" maxlength="80" placeholder="e.g. Dr. Ahmed / Front Desk" disabled>
        </div>
      </div>
      <div id="chatMessages" style="height:260px;overflow-y:auto;background:var(--gray-50);border:1px solid var(--gray-200);border-radius:10px;padding:12px;margin-bottom:10px;"></div>
      <div style="display:flex;gap:8px;">
        <input id="chatInput" type="text" maxlength="500" placeholder="Type a remark for the team…" style="flex:1;">
        <button class="btn btn-primary" id="chatSendBtn" type="button">Send</button>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    const parts = location.pathname.split('/').filter(Boolean);
    const orgSlug = parts[1] || 'petzone';
    const branchSlug = parts[2] || 'main';
    const stationParam = new URLSearchParams(location.search).get('opd') || new URLSearchParams(location.search).get('station');
    const storageKey = `opd-counter-${orgSlug}-${branchSlug}`;

    let branchId = null;
    let currentTicketId = null;
    let services = [];
    let counters = [];

    function getSelectedCounterId() {
      return document.getElementById('counterSelect').value || null;
    }

    function updateStationLabel() {
      const selected = counters.find((c) => String(c.id) === String(getSelectedCounterId()));
      const label = selected?.counter_label || selected?.name || '';
      document.getElementById('stationLabel').textContent = label
        ? `Station: ${label} — calls appear on the TV display under ${label}`
        : 'Select your station (OPD1, OPD2, or Grooming)';
    }

    function applyCounterSelection(counterId) {
      const select = document.getElementById('counterSelect');
      if (!counterId || !select) return;
      const exists = counters.some((c) => String(c.id) === String(counterId));
      if (exists) {
        select.value = String(counterId);
        localStorage.setItem(storageKey, String(counterId));
        updateStationLabel();
      }
    }

    function resolveStationCounter() {
      if (!counters.length) return;

      if (stationParam) {
        const byStation = counters.find((c) => String(c.station) === String(stationParam));
        if (byStation) {
          applyCounterSelection(byStation.id);
          return;
        }
        const byName = counters.find((c) =>
          String(c.counter_label || c.name || '').toLowerCase().includes(String(stationParam).toLowerCase())
        );
        if (byName) {
          applyCounterSelection(byName.id);
          return;
        }
      }

      const saved = localStorage.getItem(storageKey);
      if (saved) {
        applyCounterSelection(saved);
        return;
      }

      if (counters.length === 1) {
        applyCounterSelection(counters[0].id);
      }
    }

    async function loadBranch() {
      const res = await fetch(`/api/queue/public/${orgSlug}/${branchSlug}`);
      const json = await res.json();
      if (!json.success) throw new Error(json.message);
      branchId = json.data.branch.id;
      services = json.data.services;
      document.getElementById('brandTitle').textContent = 'PetZone Hospital';
      document.getElementById('branchTitle').textContent = (json.data.branch.name || '') + ' — Attendant';

      const cRes = await fetch(`/api/queue/public/${orgSlug}/${branchSlug}/counters`);
      const cJson = await cRes.json();
      counters = cJson.success ? cJson.data : [];

      const cntSelect = document.getElementById('counterSelect');
      cntSelect.innerHTML = '<option value="">Select Station</option>' +
        counters.map((c) => `<option value="${c.id}">${c.counter_label || c.name}${c.service_name ? ` (${c.service_name})` : ''}</option>`).join('');

      resolveStationCounter();
      updateStationLabel();
    }

    async function refreshQueue() {
      const counterId = getSelectedCounterId();
      const selected = counters.find((c) => String(c.id) === String(counterId));
      let url = `/api/queue/public/${orgSlug}/${branchSlug}/queue`;
      if (selected?.service_type_id) {
        url += `?service_type_id=${encodeURIComponent(selected.service_type_id)}`;
      }

      try {
        const res = await fetch(url);
        const json = await res.json();
        if (!json.success) throw new Error(json.message);
        const waiting = json.data.filter(t => t.status === 'waiting');
        const called = json.data.filter((t) => ['called', 'serving'].includes(t.status));
        const forStation = counterId
          ? called.filter((t) => String(t.counter_id) === String(counterId))
          : called.slice();
        forStation.sort((a, b) => new Date(b.called_at || 0) - new Date(a.called_at || 0));
        const myTicket = forStation[0] || null;

        document.getElementById('queueList').innerHTML = waiting.length
          ? waiting.map(t => `
              <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--gray-200);">
                <div>
                  <strong style="font-size:20px;color:var(--blue);">${t.ticket_code}</strong>
                  <span style="margin-left:8px;color:var(--gray-500);">${t.service_name}</span>
                  ${t.pet_name ? `<div style="font-size:13px;color:var(--gray-500);">Pet: ${t.pet_name}</div>` : ''}
                </div>
                ${statusBadge(t.status)}
              </div>
            `).join('')
          : '<p style="color:var(--gray-500);">No patients waiting</p>';

        if (myTicket) {
          const t = myTicket;
          currentTicketId = t.id;
          document.getElementById('currentTicket').style.display = 'block';
          document.getElementById('currentNumber').textContent = t.ticket_code;
          document.getElementById('currentNumber').style.color = t.color;
          document.getElementById('currentService').textContent = t.service_name;
          document.getElementById('currentMeta').textContent = [
            t.counter_label || t.counter_name ? `Station: ${t.counter_label || t.counter_name}` : '',
            t.pet_name ? `Pet: ${t.pet_name}` : '',
            t.owner_name ? `Owner: ${t.owner_name}` : '',
          ].filter(Boolean).join(' · ');
        } else {
          currentTicketId = null;
          document.getElementById('currentTicket').style.display = 'none';
        }
      } catch (err) {
        showAlert(document.getElementById('alert'), err.message);
      }
    }

    async function refreshStatsPublic() {
      const pubRes = await fetch(`/api/queue/public/${orgSlug}/${branchSlug}/status`);
      const pub = await pubRes.json();
      if (pub.success) {
        const waiting = pub.data.waiting_by_service.reduce((a, w) => a + (w.waiting_count || 0), 0);
        const serving = (pub.data.by_counter || []).filter((row) => row.ticket_code).length;
        document.getElementById('statWaiting').textContent = waiting;
        document.getElementById('statProgress').textContent = serving;
        document.getElementById('statCompleted').textContent = pub.data.recently_completed.length;
        document.getElementById('statTotal').textContent = waiting + serving;
      }
    }

    document.getElementById('counterSelect').addEventListener('change', () => {
      const counterId = getSelectedCounterId();
      if (counterId) localStorage.setItem(storageKey, counterId);
      updateStationLabel();
      refreshQueue();
    });

    document.getElementById('btnCallNext').addEventListener('click', async () => {
      try {
        const counterId = getSelectedCounterId();
        if (!counterId && counters.length) {
          showAlert(document.getElementById('alert'), 'Please select your station first (OPD or Grooming)');
          return;
        }

        const res = await fetch(`/api/queue/public/${orgSlug}/${branchSlug}/call-next`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ counter_id: counterId }),
        });
        const json = await res.json();
        if (!json.success) throw new Error(json.message);
        if (json.data) {
          currentTicketId = json.data.id;
          document.getElementById('currentTicket').style.display = 'block';
          document.getElementById('currentNumber').textContent = json.data.ticket_code;
          document.getElementById('currentNumber').style.color = json.data.color || 'var(--blue)';
          document.getElementById('currentService').textContent = json.data.service_name;
          document.getElementById('currentMeta').textContent = json.data.counter_label || json.data.counter_name
            ? `Now showing on TV as ${json.data.counter_label || json.data.counter_name}`
            : '';
        } else {
          showAlert(document.getElementById('alert'), 'No waiting tickets', 'success');
        }
        refreshQueue();
        refreshStatsPublic();
      } catch (err) {
        showAlert(document.getElementById('alert'), err.message);
      }
    });

    document.querySelectorAll('[data-action]').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!currentTicketId) return;
        const action = btn.dataset.action;
        try {
          if (action === 'recall') {
            await fetch(`/api/queue/public/tickets/${currentTicketId}/recall`, { method: 'POST' });
          } else {
            await fetch(`/api/queue/public/tickets/${currentTicketId}`, {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ status: action }),
            });
            if (action === 'completed' || action === 'skipped') {
              currentTicketId = null;
              document.getElementById('currentTicket').style.display = 'none';
            }
          }
          refreshQueue();
          refreshStatsPublic();
        } catch (err) {
          showAlert(document.getElementById('alert'), err.message);
        }
      });
    });

    // ── Clinic group chat (poll — does not touch Call Next) ──
    const chatKey = `qms-chat-sender-${orgSlug}-${branchSlug}`;
    let chatLastId = 0;
    let chatBusy = false;

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function getChatSenderName() {
      const select = document.getElementById('chatSender');
      if (select.value === 'custom') {
        return (document.getElementById('chatCustomName').value || '').trim() || 'Staff';
      }
      return select.value;
    }

    function syncChatSenderInputs() {
      const select = document.getElementById('chatSender');
      const custom = document.getElementById('chatCustomName');
      custom.disabled = select.value !== 'custom';
      try {
        localStorage.setItem(chatKey, JSON.stringify({
          mode: select.value,
          custom: custom.value || '',
        }));
      } catch (_) { /* ignore */ }
    }

    function restoreChatSender() {
      try {
        const saved = JSON.parse(localStorage.getItem(chatKey) || '{}');
        const select = document.getElementById('chatSender');
        const custom = document.getElementById('chatCustomName');
        if (saved.mode && [...select.options].some((o) => o.value === saved.mode)) {
          select.value = saved.mode;
        }
        if (saved.custom) custom.value = saved.custom;
      } catch (_) { /* ignore */ }
      syncChatSenderInputs();
    }

    function appendChatMessages(rows, { replace } = {}) {
      const box = document.getElementById('chatMessages');
      if (replace) box.innerHTML = '';
      if (!rows.length && replace) {
        box.innerHTML = '<p style="color:var(--gray-500);margin:0;">No messages yet. Say hello to Reception / OPD.</p>';
        return;
      }
      if (replace && rows.length) box.innerHTML = '';
      rows.forEach((m) => {
        chatLastId = Math.max(chatLastId, Number(m.id) || 0);
        const time = m.created_at
          ? new Date(m.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          : '';
        const el = document.createElement('div');
        el.style.cssText = 'margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--gray-200);';
        el.innerHTML =
          '<div style="display:flex;justify-content:space-between;gap:8px;">' +
            '<strong style="color:var(--blue);">' + escapeHtml(m.sender_name) + '</strong>' +
            '<span style="font-size:11px;color:var(--gray-500);">' + escapeHtml(time) + '</span>' +
          '</div>' +
          '<div style="margin-top:2px;white-space:pre-wrap;">' + escapeHtml(m.body) + '</div>';
        box.appendChild(el);
      });
      box.scrollTop = box.scrollHeight;
    }

    async function refreshChat({ initial } = {}) {
      try {
        const q = initial || !chatLastId
          ? '?limit=50'
          : `?since_id=${chatLastId}&limit=50`;
        const res = await fetch(`/api/queue/public/${orgSlug}/${branchSlug}/chat${q}`);
        const json = await res.json();
        if (!json.success) throw new Error(json.message || 'Chat failed');
        const rows = json.data || [];
        if (initial || !chatLastId) appendChatMessages(rows, { replace: true });
        else if (rows.length) appendChatMessages(rows);
        document.getElementById('chatStatus').textContent = 'Live';
        document.getElementById('chatStatus').style.color = '#15803d';
      } catch (err) {
        document.getElementById('chatStatus').textContent = 'Offline';
        document.getElementById('chatStatus').style.color = '#b91c1c';
      }
    }

    async function sendChat() {
      if (chatBusy) return;
      const body = (document.getElementById('chatInput').value || '').trim();
      if (!body) return;
      const sender_name = getChatSenderName();
      chatBusy = true;
      document.getElementById('chatSendBtn').disabled = true;
      try {
        const res = await fetch(`/api/queue/public/${orgSlug}/${branchSlug}/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sender_name, sender_role: sender_name, body }),
        });
        const json = await res.json();
        if (!json.success) throw new Error(json.message || 'Send failed');
        document.getElementById('chatInput').value = '';
        if (json.data) appendChatMessages([json.data]);
        else await refreshChat();
      } catch (err) {
        showAlert(document.getElementById('alert'), err.message);
      } finally {
        chatBusy = false;
        document.getElementById('chatSendBtn').disabled = false;
        document.getElementById('chatInput').focus();
      }
    }

    document.getElementById('chatSender').addEventListener('change', syncChatSenderInputs);
    document.getElementById('chatCustomName').addEventListener('input', syncChatSenderInputs);
    document.getElementById('chatSendBtn').addEventListener('click', sendChat);
    document.getElementById('chatInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        sendChat();
      }
    });
    restoreChatSender();

    loadBranch().then(() => {
      refreshQueue();
      refreshStatsPublic();
      refreshChat({ initial: true });
      setInterval(() => { refreshQueue(); refreshStatsPublic(); }, 4000);
      setInterval(() => { refreshChat(); }, 3500);
    }).catch(err => showAlert(document.getElementById('alert'), err.message));
  </script>
</body>
</html>
