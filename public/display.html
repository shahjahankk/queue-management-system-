<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PetZone Hospital - Queue Display</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800;900&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: 'Manrope', 'Segoe UI', system-ui, sans-serif;
    }

    body {
      background: #07111f;
      color: #fff;
      display: flex;
      flex-direction: column;
    }

    .tv-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      background: linear-gradient(180deg, rgba(7,17,31,0.96), rgba(7,17,31,0.82));
      border-bottom: 1px solid rgba(255,255,255,0.08);
      flex-shrink: 0;
      z-index: 5;
    }

    .tv-header img { height: 44px; filter: brightness(0) invert(1); }
    .tv-brand { display: flex; align-items: center; gap: 14px; }
    .sound-toggle {
      border: 1px solid rgba(255,255,255,0.55);
      border-radius: 999px;
      padding: 8px 14px;
      background: rgba(255,255,255,0.08);
      color: #fff;
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .sound-toggle.enabled { background: #15803d; border-color: #4ade80; }

    .tv-header-center { text-align: center; }
    .tv-header-center h1 {
      font-family: 'Sora', sans-serif;
      font-size: clamp(20px, 2.2vw, 32px);
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .tv-header-center p {
      font-size: 13px;
      opacity: 0.55;
      margin-top: 2px;
    }

    .tv-clock {
      font-size: clamp(22px, 2.4vw, 34px);
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.04em;
      min-width: 120px;
      text-align: right;
      opacity: 0.92;
    }

    .tv-stage {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr 30%;
      gap: 0;
    }

    .video-pane {
      position: relative;
      overflow: hidden;
      background: #0b1a2e;
      min-height: 0;
    }

    .video-pane video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #0b1a2e;
    }

    .video-fallback {
      position: absolute;
      inset: 0;
      display: none;
      background:
        radial-gradient(ellipse at 20% 20%, rgba(56,189,248,0.22), transparent 45%),
        radial-gradient(ellipse at 80% 30%, rgba(244,114,182,0.18), transparent 40%),
        radial-gradient(ellipse at 50% 90%, rgba(52,211,153,0.16), transparent 45%),
        linear-gradient(145deg, #0a1628 0%, #12305f 50%, #1e3a8a 100%);
      animation: ambientShift 18s ease-in-out infinite alternate;
    }

    .video-pane.fallback .video-fallback { display: block; }
    .video-pane.fallback video { display: none; }

    @keyframes ambientShift {
      from { filter: hue-rotate(0deg) saturate(1); transform: scale(1); }
      to { filter: hue-rotate(18deg) saturate(1.15); transform: scale(1.04); }
    }

    .video-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(7,17,31,0.15), transparent 28%, transparent 72%, rgba(7,17,31,0.55)),
        linear-gradient(180deg, rgba(7,17,31,0.25), transparent 30%, transparent 70%, rgba(7,17,31,0.35));
    }

    .video-caption {
      position: absolute;
      left: 28px;
      bottom: 24px;
      z-index: 2;
      max-width: 55%;
      text-shadow: 0 8px 30px rgba(0,0,0,0.55);
    }

    .video-caption strong {
      display: block;
      font-family: 'Sora', sans-serif;
      font-size: clamp(22px, 2.6vw, 40px);
      font-weight: 800;
      margin-bottom: 6px;
    }

    .video-caption span {
      font-size: clamp(13px, 1.2vw, 18px);
      opacity: 0.8;
      font-weight: 600;
    }

    .queue-pane {
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: linear-gradient(180deg, #0d1b2e 0%, #102445 55%, #0c274f 100%);
      border-left: 1px solid rgba(255,255,255,0.1);
      padding: 18px 16px 16px;
    }

    .queue-pane-title {
      font-family: 'Sora', sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      opacity: 0.5;
      margin-bottom: 12px;
      flex-shrink: 0;
    }

    #nowServing {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 0;
      overflow: hidden;
    }

    .opd-card {
      flex: 1;
      min-height: 0;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px 8px;
      position: relative;
      overflow: hidden;
      transition: border-color 0.3s, box-shadow 0.3s, background 0.3s, transform 0.3s;
    }

    .opd-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: rgba(255,255,255,0.14);
    }

    .opd-card.active {
      background: rgba(255,255,255,0.11);
      border-color: #ffb6c1;
      box-shadow: 0 0 36px rgba(255,182,193,0.18);
    }

    .opd-card.active::before {
      background: linear-gradient(90deg, #ffb6c1, #f472b6);
    }

    .opd-card.flash { animation: cardFlash 1.2s ease; }

    @keyframes cardFlash {
      0% { transform: scale(1); }
      25% { transform: scale(1.03); box-shadow: 0 0 50px rgba(255,255,255,0.35); }
      100% { transform: scale(1); }
    }

    .opd-room {
      font-size: clamp(13px, 1.1vw, 18px);
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      opacity: 0.7;
      margin-bottom: 4px;
    }

    .opd-card.active .opd-room { opacity: 1; color: #ffb6c1; }

    .opd-number {
      font-family: 'Sora', sans-serif;
      font-size: clamp(42px, 5.5vw, 78px);
      font-weight: 800;
      line-height: 1;
      color: #ffb6c1;
      text-shadow: 0 4px 28px rgba(255,182,193,0.4);
    }

    .opd-card.idle .opd-number {
      color: rgba(255,255,255,0.18);
      text-shadow: none;
      font-size: clamp(34px, 4.4vw, 58px);
    }

    .opd-hint {
      margin-top: 6px;
      font-size: clamp(11px, 0.95vw, 14px);
      font-weight: 600;
      opacity: 0.5;
      text-align: center;
      padding: 0 8px;
    }

    .opd-card.active .opd-hint { opacity: 0.9; }
    .opd-card.active .opd-hint.serving { color: #86efac; }

    .tv-footer {
      flex-shrink: 0;
      margin-top: 12px;
      background: rgba(0,0,0,0.28);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .tv-footer-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .tv-footer-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      opacity: 0.45;
    }

    .tv-footer-waiting {
      font-size: clamp(13px, 1.15vw, 16px);
      font-weight: 600;
      text-align: right;
    }

    .tv-footer-waiting span { opacity: 0.5; font-weight: 500; }

    .tv-footer-next-num {
      font-family: 'Sora', sans-serif;
      font-size: clamp(28px, 3.4vw, 42px);
      font-weight: 800;
      color: #ffb6c1;
      line-height: 1;
    }

    .tv-footer-clear {
      font-size: 14px;
      opacity: 0.42;
      font-style: italic;
    }

    @media (max-width: 900px), (orientation: portrait) {
      .tv-stage {
        grid-template-columns: 1fr;
        grid-template-rows: 55% 45%;
      }
      .queue-pane { border-left: 0; border-top: 1px solid rgba(255,255,255,0.1); }
      #nowServing { flex-direction: row; }
      .opd-card { min-width: 0; }
      .video-caption { max-width: 80%; }
    }
  </style>
</head>
<body>
  <header class="tv-header">
    <div class="tv-brand">
      <img src="/assets/petzonelogo.png" alt="PetZone Hospital" onerror="this.style.display='none'">
      <button type="button" id="soundToggle" class="sound-toggle">🔇 Enable Sound</button>
    </div>
    <div class="tv-header-center">
      <h1 id="brandName">PetZone Hospital</h1>
      <p id="branchName"></p>
    </div>
    <div class="tv-clock" id="clock">--:--:--</div>
  </header>

  <section class="tv-stage">
    <div class="video-pane" id="videoPane">
      <video
        id="displayVideo"
        autoplay
        muted
        loop
        playsinline
        preload="auto"
      ></video>
      <div class="video-fallback" aria-hidden="true"></div>
      <div class="video-overlay"></div>
      <div class="video-caption">
        <strong>Caring for every pet</strong>
        <span>Relax while we call your token</span>
      </div>
    </div>

    <aside class="queue-pane">
      <div class="queue-pane-title">Now Serving</div>
      <div id="nowServing">
        <div class="opd-card idle">
          <div class="opd-room">Loading</div>
          <div class="opd-number">—</div>
        </div>
      </div>
      <footer class="tv-footer">
        <div class="tv-footer-row">
          <div class="tv-footer-label">Waiting</div>
          <div id="waitingInfo" class="tv-footer-waiting">—</div>
        </div>
        <div class="tv-footer-row">
          <div class="tv-footer-label">Up Next</div>
          <div class="tv-footer-next-num" id="nextNum">—</div>
        </div>
      </footer>
    </aside>
  </section>

  <script>
    const parts = location.pathname.split('/').filter(Boolean);
    const orgSlug = parts[1] || 'petzone';
    const branchSlug = parts[2] || 'main';
    const query = new URLSearchParams(location.search);
    const prevServing = new Map();
    const announcementState = new Map();
    let announcementsInitialized = false;
    let soundEnabled = localStorage.getItem('qms_display_sound') === 'on';
    let sharedContext = null;
    const announcementFifo = [];
    let fifoRunning = false;

    // Video: ?video=URL  OR  localStorage qms_display_video  OR  /assets/display-video.mp4
    // Drop your clinic video at public/assets/display-video.mp4 for offline TV use.
    const DEFAULT_REMOTE_VIDEO =
      'https://videos.pexels.com/video-files/3196257/3196257-uhd_2560_1440_25fps.mp4';
    const videoCandidates = [
      query.get('video'),
      localStorage.getItem('qms_display_video'),
      '/assets/display-video.mp4',
      DEFAULT_REMOTE_VIDEO,
    ].filter(Boolean);

    function displayNum(code) {
      if (!code) return null;
      const stripped = String(code).replace(/^[A-Za-z]+/, '');
      const num = parseInt(stripped, 10);
      return Number.isNaN(num) ? stripped : String(num);
    }

    function updateClock() {
      document.getElementById('clock').textContent = new Date().toLocaleTimeString([], {
        hour: '2-digit', minute: '2-digit', second: '2-digit',
      });
    }

    function showVideoFallback() {
      document.getElementById('videoPane').classList.add('fallback');
    }

    function setupVideo() {
      const video = document.getElementById('displayVideo');
      let index = 0;

      const tryNext = () => {
        if (index >= videoCandidates.length) {
          showVideoFallback();
          return;
        }
        const src = videoCandidates[index++];
        video.src = src;
        video.load();
        const playPromise = video.play();
        if (playPromise && playPromise.catch) {
          playPromise.catch(() => {
            // Autoplay blocked or bad source — try next / fallback
            tryNext();
          });
        }
      };

      video.addEventListener('error', () => tryNext());
      video.addEventListener('loadeddata', () => {
        document.getElementById('videoPane').classList.remove('fallback');
      });
      tryNext();

      // Keep muted so token voice announcements stay clear
      video.muted = true;
      video.volume = 0;
    }

    function getAudioContext() {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return null;
      if (!sharedContext || sharedContext.state === 'closed') {
        sharedContext = new AudioContextClass();
      }
      return sharedContext;
    }

    async function unlockAudio() {
      const context = getAudioContext();
      if (!context) return false;
      try {
        if (context.state === 'suspended') await context.resume();
        const buffer = context.createBuffer(1, 1, context.sampleRate || 22050);
        const source = context.createBufferSource();
        const gain = context.createGain();
        gain.gain.value = 0.001;
        source.buffer = buffer;
        source.connect(gain);
        gain.connect(context.destination);
        source.start(0);
        return true;
      } catch (_) {
        return false;
      }
    }

    function playChime() {
      try {
        const context = getAudioContext();
        if (!context) return;
        if (context.state === 'suspended') context.resume().catch(() => {});
        const gain = context.createGain();
        gain.connect(context.destination);
        gain.gain.setValueAtTime(0.0001, context.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.22, context.currentTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, context.currentTime + 0.7);
        [660, 880].forEach((frequency, index) => {
          const oscillator = context.createOscillator();
          oscillator.frequency.value = frequency;
          oscillator.connect(gain);
          oscillator.start(context.currentTime + index * 0.18);
          oscillator.stop(context.currentTime + 0.38 + index * 0.18);
        });
      } catch (_) { /* ignore */ }
    }

    async function fetchSpeechBuffer(text) {
      const phrase = String(text || '').trim().slice(0, 160);
      if (!phrase) return null;
      const encoded = encodeURIComponent(phrase);
      const candidates = [
        '/api/queue/public/announce-tts?text=' + encoded,
        'https://api.streamelements.com/kappa/v2/speech?voice=Brian&text=' + encoded,
        'https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=en&q=' + encoded,
      ];
      for (let i = 0; i < candidates.length; i++) {
        try {
          const res = await fetch(candidates[i], { cache: 'no-store', mode: 'cors' });
          if (!res.ok) continue;
          const contentType = String(res.headers.get('content-type') || '');
          if (contentType.indexOf('json') >= 0 || contentType.indexOf('text/html') >= 0) continue;
          const data = await res.arrayBuffer();
          if (!data || data.byteLength < 200) continue;
          return data;
        } catch (_) { /* next */ }
      }
      return null;
    }

    async function playArrayBuffer(arrayBuffer) {
      const context = getAudioContext();
      if (!context || !arrayBuffer) return false;
      try {
        if (context.state === 'suspended') await context.resume();
        const audioBuffer = await context.decodeAudioData(arrayBuffer.slice(0));
        const source = context.createBufferSource();
        const gain = context.createGain();
        gain.gain.value = 1;
        source.buffer = audioBuffer;
        source.connect(gain);
        gain.connect(context.destination);
        source.start(0);
        await new Promise((resolve) => {
          source.onended = resolve;
          setTimeout(resolve, Math.ceil((audioBuffer.duration || 4) * 1000) + 400);
        });
        return true;
      } catch (_) {
        return false;
      }
    }

    async function speakText(text) {
      const phrase = String(text || '').trim().slice(0, 160);
      if (!phrase) return false;
      await unlockAudio();
      const buffer = await fetchSpeechBuffer(phrase);
      if (buffer && await playArrayBuffer(buffer)) return true;
      if (!('speechSynthesis' in window)) return false;
      return new Promise((resolve) => {
        try {
          const utterance = new SpeechSynthesisUtterance(phrase);
          utterance.rate = 0.88;
          utterance.onend = () => resolve(true);
          utterance.onerror = () => resolve(false);
          window.speechSynthesis.speak(utterance);
        } catch (_) { resolve(false); }
      });
    }

    async function speakAnnouncement(row, isRecall) {
      if (!soundEnabled || !row.ticket_code) return;
      const number = displayNum(row.ticket_code) || row.ticket_code;
      const counter = row.counter_label || row.counter_name || 'the counter';
      const prefix = isRecall ? 'Recall. ' : '';
      const text = prefix + 'Token number ' + number + ', please proceed to ' + counter + '.';

      const last = announcementFifo[announcementFifo.length - 1];
      if (last && last.text === text) return;
      announcementFifo.push({ text: text });
      drainFifo();
    }

    async function drainFifo() {
      if (fifoRunning) return;
      fifoRunning = true;
      while (announcementFifo.length > 0) {
        const job = announcementFifo.shift();
        try {
          playChime();
          await new Promise((r) => setTimeout(r, 550));
          await speakText(job.text);
          await new Promise((r) => setTimeout(r, 350));
        } catch (_) { /* keep going */ }
      }
      fifoRunning = false;
    }

    function announceChanges(rows) {
      if (!announcementsInitialized) {
        rows.forEach((row) => {
          announcementState.set(String(row.counter_id), {
            code: row.ticket_code || null,
            signature: `${row.ticket_code || ''}|${row.called_at || ''}`,
          });
        });
        announcementsInitialized = true;
        return;
      }
      const pending = [];
      rows.forEach((row) => {
        const key = String(row.counter_id);
        const previous = announcementState.get(key);
        const signature = `${row.ticket_code || ''}|${row.called_at || ''}`;
        if (row.ticket_code && previous && previous.signature !== signature) {
          pending.push({ row, isRecall: previous.code === row.ticket_code });
        }
        announcementState.set(key, { code: row.ticket_code || null, signature });
      });
      pending.forEach((item) => speakAnnouncement(item.row, item.isRecall));
    }

    function updateSoundButton() {
      const button = document.getElementById('soundToggle');
      button.textContent = soundEnabled ? '🔊 Sound On' : '🔇 Enable Sound';
      button.classList.toggle('enabled', soundEnabled);
    }

    document.getElementById('soundToggle').addEventListener('click', async () => {
      soundEnabled = !soundEnabled;
      localStorage.setItem('qms_display_sound', soundEnabled ? 'on' : 'off');
      updateSoundButton();
      if (soundEnabled) {
        await unlockAudio();
        const video = document.getElementById('displayVideo');
        video.muted = true;
        video.play().catch(() => {});
        const ok = await speakText('Queue announcements enabled. Token number 10, please proceed to Grooming.');
        if (!ok) {
          alert('Voice failed on this TV browser. Keep internet enabled and try Enable Sound again.');
        }
      }
    });

    function renderOpdCards(byCounter) {
      const el = document.getElementById('nowServing');

      if (!byCounter.length) {
        el.innerHTML = `
          <div class="opd-card idle">
            <div class="opd-room">Queue</div>
            <div class="opd-number">—</div>
            <div class="opd-hint">No stations configured</div>
          </div>`;
        return;
      }

      el.innerHTML = byCounter.map((row) => {
        const key = String(row.counter_id);
        const num = displayNum(row.ticket_code);
        const changed = prevServing.get(key) !== row.ticket_code;
        prevServing.set(key, row.ticket_code);
        const isActive = Boolean(num);
        const flash = changed && isActive ? ' flash' : '';
        const serving = row.status === 'serving';
        const isGrooming = /groom/i.test(String(row.counter_label || row.counter_name || row.service_name || ''));
        const hint = isActive
          ? (serving
              ? (isGrooming ? 'In grooming' : 'In consultation')
              : (isGrooming ? 'Please proceed to grooming' : 'Please proceed to room'))
          : 'Waiting for patient';

        return `
          <div class="opd-card ${isActive ? 'active' : 'idle'}${flash}" data-counter="${key}">
            <div class="opd-room">${row.counter_label || row.counter_name}</div>
            <div class="opd-number">${num || '—'}</div>
            <div class="opd-hint${serving ? ' serving' : ''}">${hint}</div>
          </div>`;
      }).join('');
    }

    async function refresh() {
      try {
        const res = await fetch(`/api/queue/public/${orgSlug}/${branchSlug}/status`);
        const json = await res.json();
        if (!json.success) return;

        const d = json.data;
        document.getElementById('brandName').textContent = 'PetZone Hospital';
        document.getElementById('branchName').textContent = d.branch.name || '';

        announceChanges(d.by_counter || []);
        renderOpdCards(d.by_counter || []);

        const waiting = d.waiting_by_service || [];
        const totalWaiting = waiting.reduce((s, w) => s + (w.waiting_count || 0), 0);
        const nextRaw = waiting.find((w) => w.next_ticket)?.next_ticket;
        const nextNum = displayNum(nextRaw);

        const waitingEl = document.getElementById('waitingInfo');
        const nextEl = document.getElementById('nextNum');

        if (totalWaiting > 0) {
          waitingEl.innerHTML = `<strong>${totalWaiting}</strong> <span>in queue</span>`;
          nextEl.textContent = nextNum || '—';
        } else {
          waitingEl.innerHTML = '<span class="tv-footer-clear">Queue is clear</span>';
          nextEl.textContent = '—';
        }
      } catch (_) { /* silent */ }
    }

    setupVideo();
    updateClock();
    updateSoundButton();
    setInterval(updateClock, 1000);
    refresh();
    setInterval(refresh, 2500);
  </script>
</body>
</html>
