<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PetZone - Queue Display</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="display-screen">
  <div class="display-header">
    <img src="/assets/petzonelogo.png" alt="PetZone" class="logo-lg" style="filter: brightness(0) invert(1);" onerror="this.src='/assets/petzonelogo.svg'">
    <div style="text-align: center;">
      <h1 id="branchName" style="font-size: 32px;">PetZone Clinic</h1>
      <p id="orgName" style="opacity: 0.7;"></p>
    </div>
    <div class="clock" id="clock"></div>
  </div>

  <h2 style="font-size: 28px; margin-bottom: 20px; opacity: 0.9;">Now Serving</h2>
  <div id="nowServing" class="opd-serving-grid">
    <div class="opd-serving-card pulse">
      <div class="opd-label">Loading...</div>
      <div class="number">—</div>
    </div>
  </div>

  <div class="waiting-panel">
    <h2 style="font-size: 24px; margin-bottom: 16px;">Waiting Queue</h2>
    <div id="waitingList"></div>
    <div id="waitingMeta" style="margin-top: 12px; opacity: 0.6; font-size: 14px;"></div>
  </div>

  <script>
    const parts = location.pathname.split('/').filter(Boolean);
    const orgSlug = parts[1] || 'petzone';
    const branchSlug = parts[2] || 'main';
    const prevServing = new Map();

    function updateClock() {
      document.getElementById('clock').textContent = new Date().toLocaleTimeString([], {
        hour: '2-digit', minute: '2-digit', second: '2-digit'
      });
    }

    function renderOpdCards(byCounter) {
      const servingEl = document.getElementById('nowServing');
      const cols = Math.min(Math.max(byCounter.length, 1), 4);

      servingEl.className = 'opd-serving-grid';
      servingEl.style.setProperty('--opd-cols', cols);

      if (!byCounter.length) {
        servingEl.innerHTML = `
          <div class="opd-serving-card pulse">
            <div class="opd-label">Consultancy</div>
            <div class="number">—</div>
            <div class="opd-status">No OPD counters configured</div>
          </div>`;
        return;
      }

      servingEl.innerHTML = byCounter.map((row) => {
        const key = String(row.counter_id);
        const changed = prevServing.get(key) !== row.ticket_code;
        prevServing.set(key, row.ticket_code);
        const active = row.ticket_code ? 'is-active' : 'is-idle';
        const flash = changed && row.ticket_code ? ' just-called' : '';

        return `
          <div class="opd-serving-card ${active}${flash}" data-counter="${key}">
            <div class="opd-label">${row.counter_label || row.counter_name}</div>
            <div class="number">${row.ticket_code || '—'}</div>
            <div class="opd-status">${row.ticket_code ? (row.status === 'serving' ? 'In consultation' : 'Please proceed') : 'Waiting for patient'}</div>
          </div>`;
      }).join('');
    }

    async function refresh() {
      try {
        const res = await fetch(`/api/queue/public/${orgSlug}/${branchSlug}/status`);
        const json = await res.json();
        if (!json.success) return;

        const d = json.data;
        document.getElementById('branchName').textContent = d.branch.name;
        document.getElementById('orgName').textContent = d.branch.org_name;

        renderOpdCards(d.by_counter || []);

        const waiting = d.waiting_by_service || [];
        const totalWaiting = waiting.reduce((sum, w) => sum + (w.waiting_count || 0), 0);
        const nextTicket = waiting.find((w) => w.next_ticket)?.next_ticket;

        document.getElementById('waitingList').innerHTML = waiting.length
          ? waiting.map((w) => `
              <div class="waiting-row">
                <span>${w.name} <span style="opacity:0.5;">(${w.waiting_count} waiting)</span></span>
                <span class="next-num">${w.next_ticket || '—'}</span>
              </div>
            `).join('')
          : '<div class="waiting-row"><span>No patients waiting</span><span class="next-num">—</span></div>';

        document.getElementById('waitingMeta').textContent =
          totalWaiting > 0 ? `Next in queue: ${nextTicket || '—'} · ${totalWaiting} patient(s) waiting` : 'Queue is clear';
      } catch (e) { /* silent refresh */ }
    }

    updateClock();
    setInterval(updateClock, 1000);
    refresh();
    setInterval(refresh, 2500);
  </script>
</body>
</html>
