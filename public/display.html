<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PetZone - Queue Display</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
    }

    body {
      background: linear-gradient(160deg, #0a1628 0%, #1e3a8a 55%, #1e40af 100%);
      color: #fff;
      display: flex;
      flex-direction: column;
    }

    /* ── Top bar ── */
    .tv-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 40px;
      background: rgba(0,0,0,0.25);
      border-bottom: 1px solid rgba(255,255,255,0.1);
      flex-shrink: 0;
    }

    .tv-header img { height: 52px; filter: brightness(0) invert(1); }
    .tv-brand { display: flex; align-items: center; gap: 16px; }
    .sound-toggle {
      border: 1px solid rgba(255,255,255,0.65);
      border-radius: 10px;
      padding: 9px 14px;
      background: rgba(255,255,255,0.1);
      color: #fff;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .sound-toggle.enabled { background: #15803d; border-color: #4ade80; }

    .tv-header-center { text-align: center; }
    .tv-header-center h1 {
      font-size: clamp(22px, 2.5vw, 36px);
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .tv-header-center p {
      font-size: 14px;
      opacity: 0.55;
      margin-top: 2px;
    }

    .tv-clock {
      font-size: clamp(28px, 3vw, 42px);
      font-weight: 300;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.05em;
      min-width: 140px;
      text-align: right;
    }

    /* ── Main serving area ── */
    .tv-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 28px 40px 20px;
      min-height: 0;
    }

    .tv-section-title {
      font-size: 15px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      opacity: 0.45;
      margin-bottom: 20px;
    }

    #nowServing {
      flex: 1;
      display: grid;
      gap: 24px;
      align-content: stretch;
      min-height: 0;
    }

    /* OPD card */
    .opd-card {
      background: rgba(255,255,255,0.07);
      border: 2px solid rgba(255,255,255,0.12);
      border-radius: 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      position: relative;
      overflow: hidden;
      transition: border-color 0.3s, box-shadow 0.3s, background 0.3s;
    }

    .opd-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 5px;
      background: rgba(255,255,255,0.15);
      border-radius: 28px 28px 0 0;
    }

    .opd-card.active {
      background: rgba(255,255,255,0.13);
      border-color: #ffb6c1;
      box-shadow: 0 0 60px rgba(255,182,193,0.2), inset 0 0 40px rgba(255,182,193,0.05);
    }

    .opd-card.active::before {
      background: linear-gradient(90deg, #ffb6c1, #f472b6);
    }

    .opd-card.flash {
      animation: cardFlash 1.4s ease;
    }

    @keyframes cardFlash {
      0%   { transform: scale(1); }
      20%  { transform: scale(1.03); box-shadow: 0 0 80px rgba(255,255,255,0.4); }
      100% { transform: scale(1); }
    }

    .opd-room {
      font-size: clamp(20px, 2.2vw, 32px);
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0.7;
      margin-bottom: 8px;
    }

    .opd-card.active .opd-room { opacity: 1; color: #ffb6c1; }

    .opd-number {
      font-size: clamp(80px, 14vw, 160px);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.03em;
      color: #ffb6c1;
      text-shadow: 0 4px 40px rgba(255,182,193,0.45);
    }

    .opd-card.idle .opd-number {
      font-size: clamp(60px, 10vw, 100px);
      color: rgba(255,255,255,0.15);
      text-shadow: none;
    }

    .opd-hint {
      margin-top: 12px;
      font-size: clamp(14px, 1.4vw, 20px);
      font-weight: 600;
      opacity: 0.5;
      text-align: center;
      padding: 0 12px;
    }

    .opd-card.active .opd-hint {
      opacity: 0.85;
      color: #fff;
    }

    .opd-card.active .opd-hint.serving { color: #86efac; }

    /* ── Bottom waiting strip ── */
    .tv-footer {
      flex-shrink: 0;
      margin: 0 40px 28px;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 20px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .tv-footer-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .tv-footer-label {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      opacity: 0.45;
    }

    .tv-footer-waiting {
      font-size: clamp(16px, 1.8vw, 22px);
      font-weight: 600;
    }

    .tv-footer-waiting span { opacity: 0.5; font-weight: 400; }

    .tv-footer-next {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .tv-footer-next-label {
      font-size: 14px;
      font-weight: 600;
      opacity: 0.5;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .tv-footer-next-num {
      font-size: clamp(36px, 5vw, 56px);
      font-weight: 900;
      color: #ffb6c1;
      line-height: 1;
    }

    .tv-footer-clear {
      font-size: 18px;
      opacity: 0.4;
      font-style: italic;
    }
  </style>
</head>
<body>
  <header class="tv-header">
    <div class="tv-brand">
      <img src="/assets/petzonelogo.png" alt="PetZone" onerror="this.style.display='none'">
      <button type="button" id="soundToggle" class="sound-toggle">🔇 Enable Sound</button>
    </div>
    <div class="tv-header-center">
      <h1 id="branchName">PetZone Clinic</h1>
      <p id="orgName"></p>
    </div>
    <div class="tv-clock" id="clock">--:--:--</div>
  </header>

  <main class="tv-main">
    <div class="tv-section-title">Now Serving</div>
    <div id="nowServing">
      <div class="opd-card idle">
        <div class="opd-room">Loading</div>
        <div class="opd-number">—</div>
      </div>
    </div>
  </main>

  <footer class="tv-footer">
    <div class="tv-footer-left">
      <div class="tv-footer-label">Waiting</div>
      <div id="waitingInfo" class="tv-footer-waiting">—</div>
    </div>
    <div class="tv-footer-next">
      <div class="tv-footer-next-label">Up Next</div>
      <div class="tv-footer-next-num" id="nextNum">—</div>
    </div>
  </footer>

  <script>
    const parts = location.pathname.split('/').filter(Boolean);
    const orgSlug = parts[1] || 'petzone';
    const branchSlug = parts[2] || 'main';
    const prevServing = new Map();
    const announcementState = new Map();
    let announcementsInitialized = false;
    let soundEnabled = localStorage.getItem('qms_display_sound') === 'on';

    function displayNum(code) {
      if (!code) return null;
      const stripped = String(code).replace(/^[A-Za-z]+/, '');
      const num = parseInt(stripped, 10);
      return Number.isNaN(num) ? stripped : String(num);
    }

    function updateClock() {
      document.getElementById('clock').textContent = new Date().toLocaleTimeString([], {
        hour: '2-digit', minute: '2-digit', second: '2-digit',
      });
    }

    function playChime() {
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        const context = new AudioContextClass();
        const gain = context.createGain();
        gain.connect(context.destination);
        gain.gain.setValueAtTime(0.0001, context.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.2, context.currentTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, context.currentTime + 0.65);
        [660, 880].forEach((frequency, index) => {
          const oscillator = context.createOscillator();
          oscillator.frequency.value = frequency;
          oscillator.connect(gain);
          oscillator.start(context.currentTime + index * 0.18);
          oscillator.stop(context.currentTime + 0.35 + index * 0.18);
        });
        setTimeout(() => context.close().catch(() => {}), 900);
      } catch (_) { /* speech may still be available */ }
    }

    function speakAnnouncement(row, isRecall) {
      if (!soundEnabled || !row.ticket_code) return;
      playChime();
      if (!('speechSynthesis' in window)) return;
      const number = displayNum(row.ticket_code) || row.ticket_code;
      const counter = row.counter_label || row.counter_name || 'the counter';
      const prefix = isRecall ? 'Recall. ' : '';
      const utterance = new SpeechSynthesisUtterance(
        `${prefix}Token number ${number}, please proceed to ${counter}.`
      );
      utterance.rate = 0.88;
      utterance.pitch = 1;
      utterance.volume = 1;
      window.speechSynthesis.speak(utterance);
    }

    function announceChanges(rows) {
      if (!announcementsInitialized) {
        rows.forEach((row) => {
          announcementState.set(String(row.counter_id), {
            code: row.ticket_code || null,
            signature: `${row.ticket_code || ''}|${row.called_at || ''}`,
          });
        });
        announcementsInitialized = true;
        return;
      }
      rows.forEach((row) => {
        const key = String(row.counter_id);
        const previous = announcementState.get(key);
        const signature = `${row.ticket_code || ''}|${row.called_at || ''}`;
        if (row.ticket_code && previous && previous.signature !== signature) {
          speakAnnouncement(row, previous.code === row.ticket_code);
        }
        announcementState.set(key, { code: row.ticket_code || null, signature });
      });
    }

    function updateSoundButton() {
      const button = document.getElementById('soundToggle');
      button.textContent = soundEnabled ? '🔊 Sound On' : '🔇 Enable Sound';
      button.classList.toggle('enabled', soundEnabled);
    }

    document.getElementById('soundToggle').addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      localStorage.setItem('qms_display_sound', soundEnabled ? 'on' : 'off');
      updateSoundButton();
      if (soundEnabled) {
        playChime();
        if ('speechSynthesis' in window) {
          window.speechSynthesis.speak(new SpeechSynthesisUtterance('Queue announcements enabled.'));
        }
      } else if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
    });

    function renderOpdCards(byCounter) {
      const el = document.getElementById('nowServing');
      const count = Math.max(byCounter.length, 1);

      el.style.gridTemplateColumns = `repeat(${count}, 1fr)`;

      if (!byCounter.length) {
        el.innerHTML = `
          <div class="opd-card idle">
            <div class="opd-room">Consultancy</div>
            <div class="opd-number">—</div>
            <div class="opd-hint">No OPD stations configured</div>
          </div>`;
        return;
      }

      el.innerHTML = byCounter.map((row) => {
        const key = String(row.counter_id);
        const num = displayNum(row.ticket_code);
        const changed = prevServing.get(key) !== row.ticket_code;
        prevServing.set(key, row.ticket_code);
        const isActive = Boolean(num);
        const flash = changed && isActive ? ' flash' : '';
        const serving = row.status === 'serving';
        const hint = isActive
          ? (serving ? 'In consultation' : 'Please proceed to room')
          : 'Waiting for patient';

        return `
          <div class="opd-card ${isActive ? 'active' : 'idle'}${flash}" data-counter="${key}">
            <div class="opd-room">${row.counter_label || row.counter_name}</div>
            <div class="opd-number">${num || '—'}</div>
            <div class="opd-hint${serving ? ' serving' : ''}">${hint}</div>
          </div>`;
      }).join('');
    }

    async function refresh() {
      try {
        const res = await fetch(`/api/queue/public/${orgSlug}/${branchSlug}/status`);
        const json = await res.json();
        if (!json.success) return;

        const d = json.data;
        document.getElementById('branchName').textContent = d.branch.name;
        document.getElementById('orgName').textContent = d.branch.org_name || '';

        announceChanges(d.by_counter || []);
        renderOpdCards(d.by_counter || []);

        const waiting = d.waiting_by_service || [];
        const totalWaiting = waiting.reduce((s, w) => s + (w.waiting_count || 0), 0);
        const nextRaw = waiting.find((w) => w.next_ticket)?.next_ticket;
        const nextNum = displayNum(nextRaw);

        const waitingEl = document.getElementById('waitingInfo');
        const nextEl = document.getElementById('nextNum');

        if (totalWaiting > 0) {
          waitingEl.innerHTML = `<strong>${totalWaiting}</strong> <span>patient${totalWaiting !== 1 ? 's' : ''} in queue</span>`;
          nextEl.textContent = nextNum || '—';
        } else {
          waitingEl.innerHTML = '<span class="tv-footer-clear">Queue is clear</span>';
          nextEl.textContent = '—';
        }
      } catch (_) { /* silent */ }
    }

    updateClock();
    updateSoundButton();
    setInterval(updateClock, 1000);
    refresh();
    setInterval(refresh, 2500);
  </script>
</body>
</html>
