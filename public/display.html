<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PetZone Hospital — Live Queue</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --teal: #0d9488;
      --rail-w: clamp(240px, 15vw, 320px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      overflow: hidden;
      font-family: 'Manrope', system-ui, sans-serif;
      background: #020617;
      color: #fff;
    }

    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    .video-layer {
      position: absolute;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse at 30% 40%, rgba(13, 148, 136, 0.35), transparent 55%),
        radial-gradient(ellipse at 80% 70%, rgba(14, 116, 144, 0.3), transparent 50%),
        linear-gradient(145deg, #0c4a6e, #134e4a 50%, #0f172a);
    }
    .video-layer video,
    .video-layer .yt-frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      pointer-events: none;
    }
    .video-layer video {
      object-fit: cover;
    }
    .video-layer .yt-wrap {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
    .video-layer .yt-wrap iframe {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100vw;
      height: 56.25vw; /* 16:9 */
      min-height: 100vh;
      min-width: 177.78vh;
      transform: translate(-50%, -50%);
      border: 0;
      pointer-events: none;
    }
    .video-layer.fallback video,
    .video-layer.fallback .yt-wrap { display: none; }
    .video-layer.yt-mode video { display: none; }
    .video-layer.mp4-mode .yt-wrap { display: none; }
    .video-layer::after {
      content: '';
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(2,6,23,0.18) 0%, rgba(2,6,23,0.08) 55%, rgba(2,6,23,0.45) 100%),
        linear-gradient(180deg, rgba(2,6,23,0.55) 0%, transparent 22%, transparent 78%, rgba(2,6,23,0.4) 100%);
      pointer-events: none;
    }
    .ambient {
      display: none;
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
    .video-layer.fallback .ambient { display: block; }
    .paw {
      position: absolute;
      font-size: clamp(2rem, 5vw, 4.5rem);
      opacity: 0.12;
      animation: float 14s ease-in-out infinite;
    }
    .paw:nth-child(1) { left: 8%; top: 18%; }
    .paw:nth-child(2) { left: 28%; top: 62%; animation-delay: -3s; }
    .paw:nth-child(3) { left: 48%; top: 28%; animation-delay: -6s; }
    .paw:nth-child(4) { left: 68%; top: 55%; animation-delay: -9s; }
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-8deg); }
      50% { transform: translateY(-28px) rotate(8deg); }
    }

    .topbar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem 1.5rem 1.05rem;
      background: linear-gradient(180deg, rgba(2, 6, 23, 0.55), rgba(2, 6, 23, 0.18));
      backdrop-filter: blur(14px) saturate(1.15);
      -webkit-backdrop-filter: blur(14px) saturate(1.15);
      border-bottom: 1px solid rgba(255,255,255,0.12);
    }
    .brand-block {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      min-width: 0;
      gap: 0.2rem;
    }
    .brand-wordmark {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(1.85rem, 3.8vw, 3.1rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.05;
      color: #fff;
      white-space: nowrap;
      text-shadow: 0 2px 16px rgba(2, 6, 23, 0.55);
    }
    .brand-wordmark em {
      font-style: normal;
      font-weight: 800;
      color: #fff;
    }
    .brand-sub {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      margin-top: 0.15rem;
    }
    .brand-sub::before,
    .brand-sub::after {
      content: '';
      width: 22px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(153, 246, 228, 0.7), transparent);
    }
    .brand-sub span {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(0.62rem, 1vw, 0.78rem);
      font-weight: 700;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(226, 232, 240, 0.88);
      white-space: nowrap;
    }
    .top-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-shrink: 0;
    }
    .sound-btn {
      border: 1px solid rgba(255,255,255,0.35);
      background: rgba(15, 23, 42, 0.35);
      color: #fff;
      border-radius: 999px;
      padding: 0.45rem 0.9rem;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      backdrop-filter: blur(8px);
      font-family: inherit;
    }
    .sound-btn.enabled {
      background: rgba(13, 148, 136, 0.55);
      border-color: rgba(153, 246, 228, 0.55);
    }
    .clock-block {
      text-align: right;
      padding: 0.35rem 0.75rem;
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.28);
      border: 1px solid rgba(255,255,255,0.22);
      backdrop-filter: blur(8px);
    }
    .clock {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(1.1rem, 2vw, 1.55rem);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
      line-height: 1.1;
    }
    .date-line {
      font-size: 0.72rem;
      font-weight: 600;
      color: rgba(255,255,255,0.75);
      margin-top: 0.1rem;
    }

    .glass-rail {
      position: absolute;
      top: calc(78px + 0.75rem);
      right: 0.85rem;
      bottom: 0.85rem;
      width: var(--rail-w);
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      padding: 0.85rem;
      border-radius: 22px;
      background: linear-gradient(165deg, rgba(15, 23, 42, 0.78), rgba(2, 6, 23, 0.88));
      backdrop-filter: blur(24px) saturate(1.2);
      -webkit-backdrop-filter: blur(24px) saturate(1.2);
      border: 1px solid rgba(255,255,255,0.18);
      box-shadow:
        0 20px 50px rgba(2, 6, 23, 0.55),
        inset 0 1px 0 rgba(255,255,255,0.14);
    }
    .rail-head {
      text-align: center;
      padding-bottom: 0.55rem;
      border-bottom: 1px solid rgba(255,255,255,0.22);
    }
    .rail-kicker {
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #99f6e4;
    }
    .rail-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.05rem;
      font-weight: 800;
      margin-top: 0.15rem;
      text-shadow: 0 2px 10px rgba(2,6,23,0.35);
    }

    .now-serving {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      overflow: hidden;
    }
    .opd-card {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0.55rem 0.45rem;
      border-radius: 16px;
      background: rgba(255,255,255,0.14);
      border: 1px solid rgba(255,255,255,0.22);
      transition: background 0.25s, border-color 0.25s, box-shadow 0.25s;
    }
    .opd-card.active {
      background: linear-gradient(160deg, rgba(13,148,136,0.55), rgba(15,23,42,0.35));
      border-color: rgba(153, 246, 228, 0.55);
      box-shadow: 0 10px 28px rgba(13, 148, 136, 0.28);
    }
    .opd-card.idle { opacity: 0.72; }
    .opd-card.flash { animation: pulseFlash 1.1s ease-in-out 3; }
    @keyframes pulseFlash {
      0%, 100% { box-shadow: 0 0 0 0 rgba(45, 212, 191, 0.0); }
      50% { box-shadow: 0 0 0 10px rgba(45, 212, 191, 0.25); }
    }
    .opd-room {
      font-size: clamp(0.95rem, 1.5vw, 1.25rem);
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #ccfbf1;
      line-height: 1.15;
    }
    .opd-number {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(3.4rem, 7.5vw, 5.8rem);
      font-weight: 800;
      line-height: 0.95;
      margin: 0.25rem 0;
      letter-spacing: -0.03em;
      text-shadow: 0 4px 18px rgba(2,6,23,0.45);
    }
    .opd-hint {
      font-size: clamp(0.78rem, 1.1vw, 0.95rem);
      font-weight: 700;
      color: rgba(255,255,255,0.88);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .opd-hint.serving { color: #fde68a; }

    .waiting-bar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.45rem;
      padding-top: 0.45rem;
      border-top: 1px solid rgba(255,255,255,0.2);
    }
    .wait-chip {
      text-align: center;
      padding: 0.45rem 0.3rem;
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.28);
      border: 1px solid rgba(255,255,255,0.18);
    }
    .wait-label {
      font-size: 0.58rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.7);
    }
    .wait-value {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(1.5rem, 2.4vw, 1.9rem);
      font-weight: 800;
      line-height: 1.15;
      margin-top: 0.1rem;
    }

    @media (max-width: 900px) {
      :root { --rail-w: min(42vw, 280px); }
      .sound-btn { display: none; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="video-layer yt-mode" id="videoPane">
      <div class="yt-wrap" id="ytWrap" aria-hidden="true"></div>
      <video id="displayVideo" muted loop playsinline preload="auto"></video>
      <div class="ambient" aria-hidden="true">
        <span class="paw">🐾</span>
        <span class="paw">🐕</span>
        <span class="paw">🐈</span>
        <span class="paw">🐾</span>
      </div>
    </div>

    <header class="topbar">
      <div class="brand-block">
        <div class="brand-wordmark" id="brandName"><em>PetZone</em> Animal Hospital</div>
        <div class="brand-sub"><span>Compassion · Care · Excellence</span></div>
      </div>
      <div class="top-actions">
        <button class="sound-btn" id="soundToggle" type="button">🔇 Enable Sound</button>
        <div class="clock-block">
          <div class="clock" id="clock">--:--:--</div>
          <div class="date-line" id="dateLine"></div>
        </div>
      </div>
    </header>

    <aside class="glass-rail" aria-label="Now serving">
      <div class="rail-head">
        <div class="rail-kicker">Live queue</div>
        <div class="rail-title">Now Serving</div>
      </div>
      <div class="now-serving" id="nowServing"></div>
      <div class="waiting-bar">
        <div class="wait-chip">
          <div class="wait-label">Waiting</div>
          <div class="wait-value" id="waitingInfo"><strong>—</strong></div>
        </div>
        <div class="wait-chip">
          <div class="wait-label">Next</div>
          <div class="wait-value" id="nextNum">—</div>
        </div>
      </div>
    </aside>
  </div>

  <script>
    const parts = location.pathname.split('/').filter(Boolean);
    const orgSlug = parts[1] || 'petzone';
    const branchSlug = parts[2] || 'main';
    const query = new URLSearchParams(location.search);
    const prevServing = new Map();
    const announcementState = new Map();
    let announcementsInitialized = false;
    let soundEnabled = localStorage.getItem('qms_display_sound') === 'on';
    let sharedContext = null;
    const announcementFifo = [];
    let fifoRunning = false;

    // Dynamic ambient video: Admin → Branches → paste YouTube/MP4 URL.
    // Override for one screen: ?youtube=VIDEO_ID or ?video=mp4Url
    // Token call/recall ducks ambient audio so announcements stay clear.
    const DEFAULT_YOUTUBE_ID = 'gcUHp8Wm7D0'; // https://www.youtube.com/watch?v=gcUHp8Wm7D0
    const DEFAULT_VIDEO_URL = 'https://www.youtube.com/watch?v=' + DEFAULT_YOUTUBE_ID;
    const PET_MP4_VIDEOS = [
      'https://videos.pexels.com/video-files/855029/855029-hd_1920_1080_30fps.mp4',
      'https://videos.pexels.com/video-files/2795407/2795407-uhd_2560_1440_25fps.mp4',
      'https://videos.pexels.com/video-files/1409899/1409899-uhd_2560_1440_25fps.mp4',
      'https://videos.pexels.com/video-files/3195394/3195394-uhd_2560_1440_25fps.mp4',
      'https://videos.pexels.com/video-files/992623/992623-hd_1920_1080_25fps.mp4',
      '/assets/display-video.mp4',
    ];
    let activeVideoKey = null;
    let mp4CandidatesLive = [];
    let mp4IndexLive = 0;
    let mp4ErrorBound = false;

    function extractYouTubeId(value) {
      if (!value) return null;
      let raw = String(value).trim();
      if (!raw) return null;
      if (/^[\w-]{11}$/.test(raw)) return raw;
      // Allow pasted links without https://
      if (!/^https?:\/\//i.test(raw) && /(?:youtube\.com|youtu\.be)/i.test(raw)) {
        raw = 'https://' + raw.replace(/^\/+/, '');
      }
      try {
        const u = new URL(raw);
        if (u.hostname.includes('youtu.be')) return u.pathname.slice(1).split('/')[0] || null;
        if (u.searchParams.get('v')) return u.searchParams.get('v');
        const parts = u.pathname.split('/').filter(Boolean);
        const embedIdx = parts.indexOf('embed');
        if (embedIdx >= 0 && parts[embedIdx + 1]) return parts[embedIdx + 1];
        const shortsIdx = parts.indexOf('shorts');
        if (shortsIdx >= 0 && parts[shortsIdx + 1]) return parts[shortsIdx + 1];
      } catch (_) { /* not a URL */ }
      const watch = raw.match(/[?&]v=([\w-]{11})/);
      if (watch) return watch[1];
      const short = raw.match(/youtu\.be\/([\w-]{11})/);
      if (short) return short[1];
      return null;
    }

    function youtubeEmbedUrl(id, withSound) {
      const params = new URLSearchParams({
        autoplay: '1',
        mute: withSound ? '0' : '1',
        controls: '0',
        loop: '1',
        playlist: id,
        modestbranding: '1',
        rel: '0',
        playsinline: '1',
        iv_load_policy: '3',
        disablekb: '1',
        fs: '0',
        enablejsapi: '1',
        origin: location.origin,
      });
      return 'https://www.youtube.com/embed/' + id + '?' + params.toString();
    }

    const AMBIENT_YT_VOLUME = 60; // audible background; token voice ducks this fully
    let ambientWanted = false;
    let ambientDucked = false;
    let currentYouTubeId = null;
    let ytPlayer = null;
    let ytApiReady = false;
    let ytApiLoading = false;

    function loadYouTubeApi() {
      if (ytApiReady || ytApiLoading) return;
      if (window.YT && window.YT.Player) {
        ytApiReady = true;
        return;
      }
      ytApiLoading = true;
      const tag = document.createElement('script');
      tag.src = 'https://www.youtube.com/iframe_api';
      document.head.appendChild(tag);
      const prev = window.onYouTubeIframeAPIReady;
      window.onYouTubeIframeAPIReady = function () {
        ytApiReady = true;
        ytApiLoading = false;
        if (typeof prev === 'function') prev();
        bindYtPlayer();
      };
    }

    function applyYtSoundState(withSound) {
      if (withSound) {
        ytCommand('unMute');
        ytCommand('setVolume', [AMBIENT_YT_VOLUME]);
        ytCommand('playVideo');
      } else {
        ytCommand('mute');
        ytCommand('setVolume', [0]);
      }
    }

    function bindYtPlayer() {
      if (!currentYouTubeId || !(window.YT && window.YT.Player)) return;
      const el = document.getElementById('ytPlayer');
      if (!el) return;
      // Keep existing binding so Enable Sound unlock survives video switches
      if (ytPlayer && typeof ytPlayer.getIframe === 'function') {
        try {
          if (ytPlayer.getIframe() === el) return;
        } catch (_) { /* rebind */ }
      }
      try {
        ytPlayer = new YT.Player('ytPlayer', {
          events: {
            onReady: function () {
              if (ambientWanted && soundEnabled && !ambientDucked) {
                try {
                  if (ytPlayer.unMute) ytPlayer.unMute();
                  if (ytPlayer.setVolume) ytPlayer.setVolume(AMBIENT_YT_VOLUME);
                  if (ytPlayer.playVideo) ytPlayer.playVideo();
                } catch (_) { /* ignore */ }
              }
            },
            onStateChange: function (e) {
              // Keep single-video ambient looping after loadVideoById
              if (e.data === window.YT.PlayerState.ENDED && ytPlayer && ytPlayer.playVideo) {
                try { ytPlayer.playVideo(); } catch (_) { /* ignore */ }
              }
            },
          },
        });
      } catch (_) { /* ignore */ }
    }

    function mountYouTube(id, withSound) {
      currentYouTubeId = id;
      const ytWrap = document.getElementById('ytWrap');
      const pane = document.getElementById('videoPane');
      if (!ytWrap || !pane) return;
      ytPlayer = null;
      ytWrap.innerHTML = '';
      pane.classList.add('yt-mode');
      pane.classList.remove('mp4-mode', 'fallback');
      const src = youtubeEmbedUrl(id, withSound) + '&cb=' + Date.now();
      const iframe = document.createElement('iframe');
      iframe.id = 'ytPlayer';
      iframe.title = 'PetZone ambient video';
      iframe.allow =
        'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
      iframe.setAttribute('allowfullscreen', '');
      iframe.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
      iframe.src = src;
      ytWrap.appendChild(iframe);
      loadYouTubeApi();
      setTimeout(bindYtPlayer, 400);
      setTimeout(bindYtPlayer, 1200);
    }

    /**
     * Swap YouTube video without destroying the iframe when possible.
     * Remounting a new iframe drops the browser's "user unlocked audio" flag,
     * which forced staff to toggle Enable Sound again.
     */
    function switchYouTubeVideo(id, withSound) {
      const pane = document.getElementById('videoPane');
      const existing = document.getElementById('ytPlayer');
      const canReuse = !!(pane && pane.classList.contains('yt-mode') && existing);

      if (canReuse) {
        currentYouTubeId = id;
        let swapped = false;
        try {
          if (ytPlayer && typeof ytPlayer.loadVideoById === 'function') {
            ytPlayer.loadVideoById(id);
            swapped = true;
          }
        } catch (_) { swapped = false; }

        if (!swapped) {
          // postMessage fallback before YT.Player is bound
          ytCommand('loadVideoById', [id]);
          swapped = true;
        }

        if (swapped) {
          applyYtSoundState(withSound);
          setTimeout(function () { applyYtSoundState(withSound); }, 400);
          setTimeout(function () { applyYtSoundState(withSound); }, 1200);
          loadYouTubeApi();
          setTimeout(bindYtPlayer, 300);
          return;
        }
      }

      mountYouTube(id, withSound);
    }

    function ytCommand(func, args) {
      try {
        if (ytPlayer && typeof ytPlayer[func] === 'function') {
          ytPlayer[func].apply(ytPlayer, args || []);
          return true;
        }
      } catch (_) { /* fall through */ }
      const iframe = document.querySelector('#ytWrap iframe');
      if (!iframe || !iframe.contentWindow) return false;
      iframe.contentWindow.postMessage(JSON.stringify({
        event: 'command',
        func: func,
        args: args || [],
      }), '*');
      return true;
    }

    function applyAmbientSound(on) {
      const video = document.getElementById('displayVideo');
      const pane = document.getElementById('videoPane');
      if (pane && pane.classList.contains('yt-mode') && currentYouTubeId) {
        if (on) {
          // Strongest path after a user click: remount unmuted so TV browsers allow audio
          mountYouTube(currentYouTubeId, true);
          setTimeout(function () {
            ytCommand('unMute');
            ytCommand('setVolume', [AMBIENT_YT_VOLUME]);
            ytCommand('playVideo');
          }, 600);
          setTimeout(function () {
            ytCommand('unMute');
            ytCommand('setVolume', [AMBIENT_YT_VOLUME]);
            ytCommand('playVideo');
          }, 1600);
        } else {
          ytCommand('mute');
          ytCommand('setVolume', [0]);
        }
        return;
      }
      if (video) {
        if (on) {
          video.muted = false;
          video.volume = 0.55;
          video.play().catch(function () {});
        } else {
          video.muted = true;
          video.volume = 0;
        }
      }
    }

    function setAmbientPlaying(on) {
      ambientWanted = Boolean(on);
      if (!on) ambientDucked = false;
      applyAmbientSound(on);
    }

    function duckAmbientAudio() {
      ambientDucked = true;
      const video = document.getElementById('displayVideo');
      const pane = document.getElementById('videoPane');
      if (pane && pane.classList.contains('yt-mode')) {
        ytCommand('mute');
        ytCommand('setVolume', [0]);
        return;
      }
      if (video) {
        video.muted = true;
        video.volume = 0;
      }
    }

    function restoreAmbientAudio() {
      ambientDucked = false;
      if (!ambientWanted || !soundEnabled) return;
      ytCommand('unMute');
      ytCommand('setVolume', [AMBIENT_YT_VOLUME]);
      ytCommand('playVideo');
      const video = document.getElementById('displayVideo');
      const pane = document.getElementById('videoPane');
      if (!(pane && pane.classList.contains('yt-mode')) && video) {
        video.muted = false;
        video.volume = 0.55;
        video.play().catch(function () {});
      }
    }

    function displayNum(code) {
      if (!code) return null;
      const stripped = String(code).replace(/^[A-Za-z]+/, '');
      const num = parseInt(stripped, 10);
      return Number.isNaN(num) ? stripped : String(num);
    }

    function updateClock() {
      const now = new Date();
      document.getElementById('clock').textContent = now.toLocaleTimeString([], {
        hour: '2-digit', minute: '2-digit', second: '2-digit',
      });
      const dateEl = document.getElementById('dateLine');
      if (dateEl) {
        dateEl.textContent = now.toLocaleDateString([], {
          weekday: 'short', month: 'short', day: 'numeric',
        });
      }
    }

    function showVideoFallback() {
      const pane = document.getElementById('videoPane');
      pane.classList.add('fallback');
      pane.classList.remove('yt-mode', 'mp4-mode');
    }

    function resolveVideoSource(serverUrl) {
      const customParam = query.get('youtube') || query.get('video');
      if (customParam) {
        const yt = extractYouTubeId(customParam);
        if (yt) return { kind: 'youtube', id: yt, key: 'yt:' + yt };
        return { kind: 'mp4', src: customParam, key: 'mp4:' + customParam };
      }
      const raw = (serverUrl && String(serverUrl).trim()) || DEFAULT_VIDEO_URL;
      const yt = extractYouTubeId(raw);
      if (yt) return { kind: 'youtube', id: yt, key: 'yt:' + yt };
      if (/^https?:\/\//i.test(raw) || raw.startsWith('/')) {
        return { kind: 'mp4', src: raw, key: 'mp4:' + raw };
      }
      return { kind: 'youtube', id: DEFAULT_YOUTUBE_ID, key: 'yt:' + DEFAULT_YOUTUBE_ID };
    }

    function applyVideoSource(serverUrl, force) {
      const pane = document.getElementById('videoPane');
      const video = document.getElementById('displayVideo');
      if (!pane || !video) return;
      const source = resolveVideoSource(serverUrl);
      if (!force && source.key === activeVideoKey) return;
      activeVideoKey = source.key;
      try { localStorage.setItem('qms_display_video', source.kind === 'youtube' ? source.id : source.src); } catch (_) { /* ignore */ }

      if (source.kind === 'youtube') {
        const wantSound = !!(soundEnabled && ambientWanted && !ambientDucked);
        switchYouTubeVideo(source.id, wantSound);
        video.removeAttribute('src');
        try { video.load(); } catch (_) { /* ignore */ }
        return;
      }

      // MP4 (custom or fallback list)
      const ytWrap = document.getElementById('ytWrap');
      if (ytWrap) ytWrap.innerHTML = '';
      currentYouTubeId = null;
      ytPlayer = null;
      pane.classList.add('mp4-mode');
      pane.classList.remove('yt-mode', 'fallback');

      mp4CandidatesLive = [source.src].concat(PET_MP4_VIDEOS.filter((u) => u !== source.src));
      mp4IndexLive = 0;
      const tryNext = () => {
        if (mp4IndexLive >= mp4CandidatesLive.length) {
          showVideoFallback();
          return;
        }
        const src = mp4CandidatesLive[mp4IndexLive++];
        video.src = src;
        video.muted = !(soundEnabled && ambientWanted && !ambientDucked);
        video.volume = video.muted ? 0 : 0.55;
        video.loop = true;
        video.load();
        const playPromise = video.play();
        if (playPromise && playPromise.catch) playPromise.catch(() => tryNext());
      };
      if (!mp4ErrorBound) {
        mp4ErrorBound = true;
        video.addEventListener('error', () => {
          if (pane.classList.contains('mp4-mode')) tryNext();
        });
        video.addEventListener('loadeddata', () => pane.classList.remove('fallback'));
      }
      tryNext();
    }

    function setupVideo() {
      // Prefer server URL from first status poll; keep local fallback only if poll is slow
      const cached = (() => {
        try { return localStorage.getItem('qms_display_video'); } catch (_) { return null; }
      })();
      applyVideoSource(cached || null);
      setTimeout(function () {
        if (!activeVideoKey) applyVideoSource(null);
      }, 4000);
    }

    function getAudioContext() {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return null;
      if (!sharedContext || sharedContext.state === 'closed') {
        sharedContext = new AudioContextClass();
      }
      return sharedContext;
    }

    async function unlockAudio() {
      const context = getAudioContext();
      if (!context) return false;
      try {
        if (context.state === 'suspended') await context.resume();
        const buffer = context.createBuffer(1, 1, context.sampleRate || 22050);
        const source = context.createBufferSource();
        const gain = context.createGain();
        gain.gain.value = 0.001;
        source.buffer = buffer;
        source.connect(gain);
        gain.connect(context.destination);
        source.start(0);
        return true;
      } catch (_) {
        return false;
      }
    }

    function playChime() {
      try {
        const context = getAudioContext();
        if (!context) return;
        if (context.state === 'suspended') context.resume().catch(() => {});
        const gain = context.createGain();
        gain.connect(context.destination);
        gain.gain.setValueAtTime(0.0001, context.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.42, context.currentTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, context.currentTime + 0.75);
        [660, 880, 990].forEach((frequency, index) => {
          const oscillator = context.createOscillator();
          oscillator.frequency.value = frequency;
          oscillator.connect(gain);
          oscillator.start(context.currentTime + index * 0.16);
          oscillator.stop(context.currentTime + 0.4 + index * 0.16);
        });
      } catch (_) { /* ignore */ }
    }

    async function fetchSpeechBuffer(text) {
      const phrase = String(text || '').trim().slice(0, 160);
      if (!phrase) return null;
      const encoded = encodeURIComponent(phrase);
      const candidates = [
        '/api/queue/public/announce-tts?text=' + encoded,
        'https://api.streamelements.com/kappa/v2/speech?voice=Brian&text=' + encoded,
        'https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=en&q=' + encoded,
      ];
      for (let i = 0; i < candidates.length; i++) {
        try {
          const res = await fetch(candidates[i], { cache: 'no-store', mode: 'cors' });
          if (!res.ok) continue;
          const contentType = String(res.headers.get('content-type') || '');
          if (contentType.indexOf('json') >= 0 || contentType.indexOf('text/html') >= 0) continue;
          const data = await res.arrayBuffer();
          if (!data || data.byteLength < 200) continue;
          return data;
        } catch (_) { /* next */ }
      }
      return null;
    }

    async function playArrayBuffer(arrayBuffer) {
      const context = getAudioContext();
      if (!context || !arrayBuffer) return false;
      try {
        if (context.state === 'suspended') await context.resume();
        const audioBuffer = await context.decodeAudioData(arrayBuffer.slice(0));
        const source = context.createBufferSource();
        const gain = context.createGain();
        gain.gain.value = 1.35;
        source.buffer = audioBuffer;
        source.connect(gain);
        gain.connect(context.destination);
        source.start(0);
        await new Promise((resolve) => {
          source.onended = resolve;
          setTimeout(resolve, Math.ceil((audioBuffer.duration || 4) * 1000) + 400);
        });
        return true;
      } catch (_) {
        return false;
      }
    }

    async function speakText(text) {
      const phrase = String(text || '').trim().slice(0, 160);
      if (!phrase) return false;
      await unlockAudio();
      const buffer = await fetchSpeechBuffer(phrase);
      if (buffer && await playArrayBuffer(buffer)) return true;
      if (!('speechSynthesis' in window)) return false;
      return new Promise((resolve) => {
        try {
          const utterance = new SpeechSynthesisUtterance(phrase);
          utterance.rate = 0.88;
          utterance.onend = () => resolve(true);
          utterance.onerror = () => resolve(false);
          window.speechSynthesis.speak(utterance);
        } catch (_) { resolve(false); }
      });
    }

    async function speakAnnouncement(row, isRecall) {
      if (!soundEnabled || !row.ticket_code) return;
      const number = displayNum(row.ticket_code) || row.ticket_code;
      const counter = row.counter_label || row.counter_name || 'the counter';
      const prefix = isRecall ? 'Recall. ' : '';
      const text = prefix + 'Token number ' + number + ', please proceed to ' + counter + '.';

      const last = announcementFifo[announcementFifo.length - 1];
      if (last && last.text === text) return;
      announcementFifo.push({ text: text });
      drainFifo();
    }

    async function drainFifo() {
      if (fifoRunning) return;
      fifoRunning = true;
      duckAmbientAudio();
      try {
        while (announcementFifo.length > 0) {
          const job = announcementFifo.shift();
          try {
            playChime();
            await new Promise((r) => setTimeout(r, 550));
            await speakText(job.text);
            await new Promise((r) => setTimeout(r, 350));
          } catch (_) { /* keep going */ }
        }
      } finally {
        restoreAmbientAudio();
        fifoRunning = false;
      }
    }

    function announceChanges(rows) {
      if (!announcementsInitialized) {
        rows.forEach((row) => {
          announcementState.set(String(row.counter_id), {
            code: row.ticket_code || null,
            signature: `${row.ticket_code || ''}|${row.called_at || ''}`,
          });
        });
        announcementsInitialized = true;
        return;
      }
      const pending = [];
      rows.forEach((row) => {
        const key = String(row.counter_id);
        const previous = announcementState.get(key);
        const signature = `${row.ticket_code || ''}|${row.called_at || ''}`;
        if (row.ticket_code && previous && previous.signature !== signature) {
          pending.push({ row, isRecall: previous.code === row.ticket_code });
        }
        announcementState.set(key, { code: row.ticket_code || null, signature });
      });
      pending.forEach((item) => speakAnnouncement(item.row, item.isRecall));
    }

    function updateSoundButton() {
      const button = document.getElementById('soundToggle');
      button.textContent = soundEnabled ? '🔊 Sound On' : '🔇 Enable Sound';
      button.classList.toggle('enabled', soundEnabled);
    }

    document.getElementById('soundToggle').addEventListener('click', async () => {
      soundEnabled = !soundEnabled;
      localStorage.setItem('qms_display_sound', soundEnabled ? 'on' : 'off');
      updateSoundButton();
      if (soundEnabled) {
        // MUST run inside the click (before awaits) so the browser allows video sound
        ambientWanted = true;
        ambientDucked = false;
        applyAmbientSound(true);

        await unlockAudio();
        // Brief pause so unmuted YouTube can start, then duck only for the test voice
        await new Promise((r) => setTimeout(r, 900));
        duckAmbientAudio();
        const ok = await speakText('Queue announcements enabled. Token number 10, please proceed to Grooming.');
        restoreAmbientAudio();
        // Extra unmute retries after the voice test
        setTimeout(function () { if (soundEnabled && ambientWanted) restoreAmbientAudio(); }, 500);
        setTimeout(function () { if (soundEnabled && ambientWanted) restoreAmbientAudio(); }, 1500);
        if (!ok) {
          alert('Token voice failed on this TV. Video sound may still work — keep internet on and try again.');
        }
      } else {
        setAmbientPlaying(false);
      }
    });

    function renderOpdCards(byCounter) {
      const el = document.getElementById('nowServing');

      if (!byCounter.length) {
        el.innerHTML = `
          <div class="opd-card idle">
            <div class="opd-room">Queue</div>
            <div class="opd-number">—</div>
            <div class="opd-hint">No stations configured</div>
          </div>`;
        return;
      }

      el.innerHTML = byCounter.map((row) => {
        const key = String(row.counter_id);
        const num = displayNum(row.ticket_code);
        const changed = prevServing.get(key) !== row.ticket_code;
        prevServing.set(key, row.ticket_code);
        const isActive = Boolean(num);
        const flash = changed && isActive ? ' flash' : '';
        const serving = row.status === 'serving';
        const isGrooming = /groom/i.test(String(row.counter_label || row.counter_name || row.service_name || ''));
        const hint = isActive
          ? (serving
              ? (isGrooming ? 'Grooming' : 'Consult')
              : (isGrooming ? 'To grooming' : 'To room'))
          : 'Waiting';

        return `
          <div class="opd-card ${isActive ? 'active' : 'idle'}${flash}" data-counter="${key}">
            <div class="opd-room">${row.counter_label || row.counter_name}</div>
            <div class="opd-number">${num || '—'}</div>
            <div class="opd-hint${serving ? ' serving' : ''}">${hint}</div>
          </div>`;
      }).join('');
    }

    async function refresh() {
      try {
        const res = await fetch(
          `/api/queue/public/${orgSlug}/${branchSlug}/status?_=${Date.now()}`,
          { cache: 'no-store', headers: { 'Cache-Control': 'no-cache' } }
        );
        const json = await res.json();
        if (!json.success) return;

        const d = json.data;
        document.getElementById('brandName').innerHTML = '<em>PetZone</em> Animal Hospital';
        applyVideoSource(d.display_video_url || null);

        announceChanges(d.by_counter || []);
        renderOpdCards(d.by_counter || []);

        const waiting = d.waiting_by_service || [];
        const totalWaiting = waiting.reduce((s, w) => s + (w.waiting_count || 0), 0);
        const nextRaw = waiting.find((w) => w.next_ticket)?.next_ticket;
        const nextNum = displayNum(nextRaw);

        const waitingEl = document.getElementById('waitingInfo');
        const nextEl = document.getElementById('nextNum');

        if (totalWaiting > 0) {
          waitingEl.innerHTML = '<strong>' + totalWaiting + '</strong>';
          nextEl.textContent = nextNum || '—';
        } else {
          waitingEl.innerHTML = '<strong style="opacity:.55;font-size:.9rem">Clear</strong>';
          nextEl.textContent = '—';
        }
      } catch (_) { /* silent */ }
    }

    setupVideo();
    updateClock();
    updateSoundButton();
    setInterval(updateClock, 1000);
    refresh();
    // Poll often enough that Admin video URL changes appear without a manual refresh
    setInterval(refresh, 2000);
  </script>
</body>
</html>
